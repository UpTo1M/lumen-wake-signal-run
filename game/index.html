<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>Lumen Wake: Signal Run</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-shell" aria-label="Lumen Wake Signal Run">
    <canvas id="game" width="960" height="600" aria-label="Playable game canvas"></canvas>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="help-chip"><span class="keycap">WASD</span> steer <span class="keycap">SPACE</span> pulse <span class="keycap">P</span> pause</div>
    <div id="live-status" class="sr-only" aria-live="polite"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
